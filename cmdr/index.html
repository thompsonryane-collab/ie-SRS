<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1a2c">
<title>SONARmobile</title>
<link rel="icon" href="../favicon.ico?v=20260910" sizes="any">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20260910">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=20260910">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png?v=20260910">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=20260910">
<link rel="manifest" href="manifest.json?v=20260911b">
<meta name="apple-mobile-web-app-title" content="SONARmobile">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg:#07111f;--bg2:#0c1a2c;--line:rgba(255,255,255,.12);--cyan:#3fd6ff;--green:#4fd98a;--amber:#ffb340}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#shell{position:fixed;inset:0;margin:0 auto;max-width:480px;background:var(--bg2);display:flex;flex-direction:column}
@media (min-width:520px){#shell{border-left:1px solid #1e2633;border-right:1px solid #1e2633}}
/* edition strip · sits inside the notch safe area, above the framed app */
.strip{position:relative;flex:none;height:calc(var(--sat) + 28px);padding:calc(var(--sat) + 3px) 10px 3px;display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(180deg,#0c1a2c,#0a1626);border-bottom:1px solid var(--line);z-index:5}
.strip button{display:flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:11px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;background:none;border:1px solid transparent;transition:background .18s,border-color .18s,opacity .18s}
.strip button i{width:5px;height:5px;border-radius:50%;background:currentColor}
.strip button[data-e="navy"]{color:var(--cyan);border-color:rgba(63,214,255,.28);background:rgba(63,214,255,.07);opacity:.6}
.strip button[data-e="utility"]{color:var(--green);border-color:rgba(79,217,138,.28);background:rgba(79,217,138,.07);opacity:.6}
.strip button[data-e="datacenter"]{color:var(--amber);border-color:rgba(255,179,64,.28);background:rgba(255,179,64,.07);opacity:.6}
.strip button.on{opacity:1}
.strip button.on[data-e="navy"]{border-color:rgba(63,214,255,.7);background:rgba(63,214,255,.18);box-shadow:0 0 10px rgba(63,214,255,.22)}
.strip button.on[data-e="utility"]{border-color:rgba(79,217,138,.7);background:rgba(79,217,138,.18);box-shadow:0 0 10px rgba(79,217,138,.22)}
.strip button.on[data-e="datacenter"]{border-color:rgba(255,179,64,.7);background:rgba(255,179,64,.18);box-shadow:0 0 10px rgba(255,179,64,.22)}
.strip .smp{flex:none;padding:3px 7px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:8px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.42);pointer-events:none}
/* carousel */
#track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
.panel{flex:none;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:var(--bg)}
.panel iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.panel .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.7);background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 40%)}
.panel .cover .wm{font-size:22px;font-weight:700;letter-spacing:-.2px;color:#fff}
.panel .cover .wm .sub{font-size:.745em;font-weight:600;letter-spacing:1.2px;margin-left:2px}
.panel .cover .wm .i{font-style:normal;color:#ff4757}
.panel .cover .e{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.panel .cover .spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cyan);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.panel.ready .cover{display:none}
/* first-launch hint */
.hint{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:14px;background:rgba(15,28,46,.92);border:1px solid var(--line);font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.hint.on{opacity:1}
</style>
</head>
<body>
<div id="shell">
  <div class="strip" id="strip">
    <button data-e="navy" class="on" onclick="SHELL.show('navy')"><i></i>Navy</button>
    <button data-e="utility" onclick="SHELL.show('utility')"><i></i>Utility</button>
    <button data-e="datacenter" onclick="SHELL.show('datacenter')"><i></i>Data center</button>
    <span class="smp" id="smp" hidden>SAMPLE</span>
  </div>
  <div id="track">
    <div class="panel" data-e="navy"><div class="cover"><div class="wm">SONAR<span class="sub">mob<i class="i">i</i>le</span></div><div class="e">Navy</div><div class="spin"></div></div><iframe name="sonarmobile-shell" data-src="navy.html" title="SONARmobile · Navy" allow="camera; microphone; autoplay; fullscreen" allowfullscreen></iframe></div>
    <div class="panel" data-e="utility"><div class="cover"><div class="wm">SONAR<span class="sub">mob<i class="i">i</i>le</span></div><div class="e">Utility · sample</div><div class="spin"></div></div><iframe data-src="utility.html" title="SONARmobile · Utility sample" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    <div class="panel" data-e="datacenter"><div class="cover"><div class="wm">SONAR<span class="sub">mob<i class="i">i</i>le</span></div><div class="e">Data center · sample</div><div class="spin"></div></div><iframe data-src="datacenter.html" title="SONARmobile · Data center sample" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  </div>
  <div class="hint" id="hint">Swipe for the Utility and Data center editions</div>
</div>
<script>
var SHELL=(function(){
  var ORDER=['navy','utility','datacenter'], track=document.getElementById('track'), cur='navy', loaded={}, hintT=null;
  function panel(e){return track.querySelector('.panel[data-e="'+e+'"]');}
  /* the shell has already eaten the notch inset — stop the framed app from
     reserving it a second time, drop its SAMPLE watermark (the strip carries
     that now), and clip the nav title so a long site name can't run under the
     network chip */
  var FIT=':root,html{--sat:0px!important}.sample-tag{display:none!important}'
        + '.nav{padding-left:14px!important;padding-right:14px!important}'
        + '.navtop{overflow:hidden!important;align-items:stretch!important}'
        + '.navtop .t1,.navtop .nav-site{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}';
  function fit(f){try{var d=f.contentDocument;if(!d||!d.head)return;if(d.getElementById('sm-shell-fit'))return;
    var s=d.createElement('style');s.id='sm-shell-fit';s.textContent=FIT;d.head.appendChild(s);}catch(x){}}
  function mount(e){var p=panel(e);if(!p||loaded[e])return;var f=p.querySelector('iframe');
    f.addEventListener('load',function(){p.classList.add('ready');fit(f);setTimeout(function(){fit(f);},400);});
    f.src=f.getAttribute('data-src');loaded[e]=true;}
  function paint(){document.querySelectorAll('.strip button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-e')===cur);});
    document.getElementById('smp').hidden=(cur==='navy');
    try{history.replaceState(null,'',cur==='navy'?location.pathname:'#'+cur);}catch(x){}
    try{var f=panel(cur).querySelector('iframe');if(f.contentWindow)f.contentWindow.postMessage({type:'SM_SHOW'},'*');}catch(x){}}
  var pend=null,pendT=null;
  function goTo(instant){var x=ORDER.indexOf(cur)*track.clientWidth;track.scrollTo({left:x,behavior:instant?'auto':'smooth'});}
  function show(e,instant){if(ORDER.indexOf(e)<0)return;mount(e);cur=e;pend=e;clearTimeout(pendT);goTo(instant);requestAnimationFrame(function(){goTo(true);});pendT=setTimeout(function(){pend=null;goTo(true);},instant?120:700);paint();}
  function step(d){var i=ORDER.indexOf(cur)+d;if(i<0||i>=ORDER.length)return;show(ORDER[i]);}
  /* native swipe on the strip / any un-framed area snaps the track; settle → update current */
  var st=null;track.addEventListener('scroll',function(){if(pend)return;clearTimeout(st);st=setTimeout(function(){var i=Math.round(track.scrollLeft/track.clientWidth);var e=ORDER[Math.max(0,Math.min(ORDER.length-1,i))];if(e!==cur){cur=e;mount(e);paint();}},80);},{passive:true});
  /* swipes forwarded from inside the framed apps, plus ADMIN ⇄ Navy relay when this shell is itself framed (ADMIN preview) */
  var navyFrame=panel('navy').querySelector('iframe');
  window.addEventListener('message',function(ev){var d=ev.data||{};
    if(d.type==='SM_SWIPE'){step(d.dir==='left'?1:-1);return;}
    if(window.parent!==window&&ev.source===navyFrame.contentWindow){try{window.parent.postMessage(d,'*');}catch(x){}return;}
    if(window.parent!==window&&ev.source===window.parent){try{navyFrame.contentWindow.postMessage(d,'*');}catch(x){}}
  });
  window.addEventListener('resize',function(){goTo(true);});
  window.addEventListener('load',function(){goTo(true);});
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
  /* boot · Navy first, deep link via #utility / #datacenter, samples mount lazily on first visit */
  var h=(location.hash||'').replace('#','');
  show(ORDER.indexOf(h)>=0?h:'navy',true);
  if(ORDER.indexOf(h)<0){try{if(!localStorage.getItem('sonarmobile_shell_hint')){var hint=document.getElementById('hint');setTimeout(function(){hint.classList.add('on');},1200);setTimeout(function(){hint.classList.remove('on');},5200);localStorage.setItem('sonarmobile_shell_hint','1');}}catch(x){}}
  return {show:show,step:step,current:function(){return cur;}};
})();
</script>
</body>
</html>
